name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  # The B2500 storage dashboard is not upstream, and only this test exercises it:
  # without it a change to the ESPHome event format (as in 2026.8, which dropped
  # `name_id`) empties the dashboard while every build stays green.
  dashboard:
    name: B2500 storage dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.JS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run dashboard E2E test
        run: npm run test:e2e
        working-directory: packages/v3
