name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Captive Portal
            directory: captive-portal
          - name: Webserver v2
            directory: v2
          - name: Webserver v3
            directory: v3
    steps:
      - name: Clone the repo
        uses: actions/checkout@v4.1.1

      - name: Set up Node.JS
        uses: actions/setup-node@v4.0.2

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.name }}
        run: npm run build
        working-directory: packages/${{ matrix.directory }}

      - uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ matrix.name }}
          path: _static/**/*.h

  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      # Checkout repo, create new git tag, and git release with artifacts
      - name: Checkout the repo
        uses: actions/checkout@v4.1.1

      - name: Create a new tag
        id: create_tag
        run: echo tag=$(date +'%Y%m%d-%H%M%S') >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4.1.4
        with:
          path: headers
          merge-multiple: true

      - name: List files
        run: ls -R headers

      - name: Create a release
        id: create_release
        uses: softprops/action-gh-release@v2.0.4
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: headers/**/*.h
          generate_release_notes: true

  esphome-b2500-pr:
    name: Sync web UI into esphome-b2500
    runs-on: ubuntu-latest
    needs:
      - release
    steps:
      # The esphome-b2500 firmware embeds the v3 web UI as v2/www.js (via
      # js_include). This job rebuilds that bundle and opens/updates a PR in the
      # consuming repo so the embedded UI stays in sync with this repo's sources.
      #
      # Requires a repo secret ESPHOME_B2500_SYNC_TOKEN: a token with
      # contents:write + pull-requests:write on tomquist/esphome-b2500 (the
      # default GITHUB_TOKEN cannot push to another repository). Until it is set,
      # the job no-ops (green) instead of failing.
      - name: Check for sync token
        id: token
        env:
          SYNC_TOKEN: ${{ secrets.ESPHOME_B2500_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::ESPHOME_B2500_SYNC_TOKEN not set; skipping esphome-b2500 sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone esphome-webserver-b2500
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4.1.1

      - name: Set up Node.JS
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4.0.2

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm install

      - name: Build v3 web UI bundle
        if: steps.token.outputs.present == 'true'
        run: npm run xbuild
        working-directory: packages/v3

      - name: Checkout esphome-b2500
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4.1.1
        with:
          repository: tomquist/esphome-b2500
          token: ${{ secrets.ESPHOME_B2500_SYNC_TOKEN }}
          path: esphome-b2500

      - name: Update embedded web UI bundle
        if: steps.token.outputs.present == 'true'
        run: cp _static/v3/www.js esphome-b2500/v2/www.js

      - name: Create/update PR in esphome-b2500
        if: steps.token.outputs.present == 'true'
        uses: peter-evans/create-pull-request@v6.0.4
        with:
          path: esphome-b2500
          token: ${{ secrets.ESPHOME_B2500_SYNC_TOKEN }}
          commit-message: "Update embedded web UI to ${{ needs.release.outputs.tag }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: sync/webserver-www-js
          delete-branch: true
          title: "Update embedded web UI (www.js) to ${{ needs.release.outputs.tag }}"
          body: |
            Automated update of the embedded ESPHome web UI bundle (`v2/www.js`)
            from [tomquist/esphome-webserver-b2500](https://github.com/tomquist/esphome-webserver-b2500)
            @ ${{ github.sha }} (release `${{ needs.release.outputs.tag }}`).
