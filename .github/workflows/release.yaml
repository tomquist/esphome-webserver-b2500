name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Captive Portal
            directory: captive-portal
          - name: Webserver v2
            directory: v2
          - name: Webserver v3
            directory: v3
    steps:
      - name: Clone the repo
        uses: actions/checkout@v4.1.1

      - name: Set up Node.JS
        uses: actions/setup-node@v4.0.2

      - name: Install dependencies
        run: npm install

      - name: Build ${{ matrix.name }}
        run: npm run build
        working-directory: packages/${{ matrix.directory }}

      - uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ matrix.name }}
          path: _static/**/*.h

  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      # Checkout repo, create new git tag, and git release with artifacts
      - name: Checkout the repo
        uses: actions/checkout@v4.1.1

      - name: Create a new tag
        id: create_tag
        run: echo tag=$(date +'%Y%m%d-%H%M%S') >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4.1.4
        with:
          path: headers
          merge-multiple: true

      - name: List files
        run: ls -R headers

      - name: Create a release
        id: create_release
        uses: softprops/action-gh-release@v2.0.4
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: headers/**/*.h
          generate_release_notes: true

  publish-pages:
    name: Publish www.js to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      # Publishes the built v3 bundle to the gh-pages branch under a per-release
      # folder so esphome-b2500 firmware can reference an immutable, pinned URL:
      #   https://tomquist.github.io/esphome-webserver-b2500/<tag>/www.js
      # Old releases are kept (clean: false) so already-flashed devices, whose
      # firmware pins a specific tag, keep working. A "latest" copy is also
      # published for convenience.
      #
      # One-time setup: enable Pages for this repo
      # (Settings -> Pages -> Build and deployment -> Deploy from a branch -> gh-pages).
      - name: Clone repo
        uses: actions/checkout@v4.1.1

      - name: Set up Node.JS
        uses: actions/setup-node@v4.0.2

      - name: Install dependencies
        run: npm install

      - name: Build v3 web UI bundle
        run: npm run xbuild
        working-directory: packages/v3

      - name: Stage bundle for Pages
        run: |
          mkdir -p "public/${{ needs.release.outputs.tag }}" public/latest
          cp _static/v3/www.js "public/${{ needs.release.outputs.tag }}/www.js"
          cp _static/v3/www.js public/latest/www.js

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: false

  bump-b2500-url:
    name: Bump pinned web UI URL in esphome-b2500
    runs-on: ubuntu-latest
    needs:
      - release
      - publish-pages
    steps:
      # Opens/updates a PR in the consuming repo that repoints the pinned web UI
      # URL to the freshly published release. No bundle blob is copied -- only a
      # one-line URL bump.
      #
      # Auth uses a GitHub App installed on tomquist/esphome-b2500 with
      # Repository permissions Contents: read/write and Pull requests: read/write.
      # Store its App ID and PEM private key as the SYNC_APP_ID and
      # SYNC_APP_PRIVATE_KEY secrets. The App mints a short-lived installation
      # token at run time (nothing to renew). Until the secrets are set, the job
      # no-ops (green) instead of failing.
      - name: Check for app credentials
        id: creds
        env:
          APP_ID: ${{ secrets.SYNC_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::warning::SYNC_APP_ID not set; skipping esphome-b2500 sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: app-token
        if: steps.creds.outputs.present == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: tomquist
          repositories: esphome-b2500

      - name: Checkout esphome-b2500
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4.1.1
        with:
          repository: tomquist/esphome-b2500
          token: ${{ steps.app-token.outputs.token }}

      - name: Repoint pinned web UI URL
        if: steps.creds.outputs.present == 'true'
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          sed -i -E "s#(github\.io/esphome-webserver-b2500/)[^/]+(/www\.js)#\1${TAG}\2#g" \
            src/template.jinja2 src/template_v2.jinja2

      - name: Create/update PR in esphome-b2500
        if: steps.creds.outputs.present == 'true'
        uses: peter-evans/create-pull-request@v6.0.4
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Pin web UI to ${{ needs.release.outputs.tag }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: sync/webserver-www-js
          delete-branch: true
          title: "Pin web UI to ${{ needs.release.outputs.tag }}"
          body: |
            Repoints the pinned ESPHome web UI URL to
            `https://tomquist.github.io/esphome-webserver-b2500/${{ needs.release.outputs.tag }}/www.js`,
            published from [tomquist/esphome-webserver-b2500](https://github.com/tomquist/esphome-webserver-b2500) @ ${{ github.sha }}.
