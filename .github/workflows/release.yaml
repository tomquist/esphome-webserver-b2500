name: Release

on:
  push:
    branches:
      - main
    # main only moves via release PRs from dev, but there is no reason to cut a
    # release for a docs-only merge.
    paths:
      - packages/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .nvmrc
      - .github/workflows/release.yaml
      - .github/workflows/build.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    # The paths filter only constrains the push trigger; workflow_dispatch can
    # be run from any ref. Without this, dispatching from a feature branch cuts
    # a real tag and release from unreviewed code.
    if: github.ref == 'refs/heads/main'
    needs: build
    # Upstream mints a token from the esphome org's GitHub App here; this fork
    # has no such App, so the release is cut with the run's own token.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
      url: ${{ steps.create_release.outputs.url }}
    steps:
      - name: Create a new tag
        id: create_tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Create a release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: |
            release/**/*.h
            release/webserver-v1.*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-pages:
    name: Publish www.js to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      # Publishes the built v3 bundle to the gh-pages branch under a per-release
      # folder so esphome-b2500 firmware can reference an immutable, pinned URL:
      #   https://tomquist.github.io/esphome-webserver-b2500/<tag>/www.js
      # Old releases are kept (clean: false) so already-flashed devices, whose
      # firmware pins a specific tag, keep working. A "latest" copy is also
      # published for convenience.
      #
      # One-time setup: enable Pages for this repo
      # (Settings -> Pages -> Build and deployment -> Deploy from a branch -> gh-pages).
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.JS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build v3 web UI bundle
        run: npm run xbuild
        working-directory: packages/v3

      - name: Stage bundle for Pages
        run: |
          mkdir -p "public/${{ needs.release.outputs.tag }}" public/latest
          cp _static/v3/www.js "public/${{ needs.release.outputs.tag }}/www.js"
          cp _static/v3/www.js public/latest/www.js

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: false

  bump-b2500-url:
    name: Bump pinned web UI URL in esphome-b2500
    runs-on: ubuntu-latest
    # Guard the outward-facing side effect: only release commits on main may
    # open a PR in esphome-b2500.
    if: github.ref == 'refs/heads/main'
    needs:
      - release
      - publish-pages
    steps:
      # Opens/updates a PR in the consuming repo that repoints the pinned web UI
      # URL to the freshly published release. No bundle blob is copied -- only a
      # one-line URL bump.
      #
      # Auth uses a GitHub App installed on tomquist/esphome-b2500 with
      # Repository permissions Contents: read/write and Pull requests: read/write.
      # Store its App ID and PEM private key as the SYNC_APP_ID and
      # SYNC_APP_PRIVATE_KEY secrets. The App mints a short-lived installation
      # token at run time (nothing to renew). Until the secrets are set, the job
      # no-ops (green) instead of failing.
      - name: Check for app credentials
        id: creds
        env:
          APP_ID: ${{ secrets.SYNC_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::warning::SYNC_APP_ID not set; skipping esphome-b2500 sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: app-token
        if: steps.creds.outputs.present == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: tomquist
          repositories: esphome-b2500

      - name: Checkout esphome-b2500
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4.1.1
        with:
          repository: tomquist/esphome-b2500
          token: ${{ steps.app-token.outputs.token }}

      - name: Repoint pinned web UI URL
        if: steps.creds.outputs.present == 'true'
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          sed -i -E "s#(github\.io/esphome-webserver-b2500/)[^/]+(/www\.js)#\1${TAG}\2#g" \
            src/template.jinja2 src/template_v2.jinja2

      - name: Create/update PR in esphome-b2500
        if: steps.creds.outputs.present == 'true'
        uses: peter-evans/create-pull-request@v6.0.4
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Pin web UI to ${{ needs.release.outputs.tag }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: sync/webserver-www-js
          delete-branch: true
          title: "Pin web UI to ${{ needs.release.outputs.tag }}"
          body: |
            Repoints the pinned ESPHome web UI URL to
            `https://tomquist.github.io/esphome-webserver-b2500/${{ needs.release.outputs.tag }}/www.js`,
            published from [tomquist/esphome-webserver-b2500](https://github.com/tomquist/esphome-webserver-b2500) @ ${{ github.sha }}.
